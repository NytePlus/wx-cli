[package]
name = "imcp-wechat"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
wx-db = { path = "../wx-db" }
wx-media = { path = "../wx-media" }
wx-keychain = { path = "../wx-keychain" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
